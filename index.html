<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="응급실포털">
<meta name="theme-color" content="#0b6e75">
<title>동신병원 응급실 포털</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 상태줄(날짜·시각·근무 구분) → 업무 앱 그리드 → 외부 바로가기 → 준비 중 목록. 병원 PC·휴대폰 겸용 */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --ink:#14232b; --muted:#5b6d76; --line:#d9e2e6;
  --accent:#0b6e75; --accent-soft:#e1f0f1; --warn:#b4472a;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  --f-num:"IBM Plex Sans KR",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a1f; --surface:#16242b; --ink:#e4ecef; --muted:#93a6ae; --line:#26373f;
  --accent:#4fc0c6; --accent-soft:#183a3e; --warn:#ef8a6d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1f; --surface:#16242b; --ink:#e4ecef; --muted:#93a6ae; --line:#26373f;
  --accent:#4fc0c6; --accent-soft:#183a3e; --warn:#ef8a6d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;
  border-bottom:2px solid var(--accent);padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:.85rem}
.clock{text-align:right;font-variant-numeric:tabular-nums}
.clock .t{font-family:var(--f-num);font-size:1.6rem;font-weight:600;line-height:1}
.clock .d{color:var(--muted);font-size:.85rem}
.shift{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:600;
  background:var(--accent-soft);color:var(--accent)}
.shift.night{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{margin:0;font-size:.8rem;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.app{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);color:inherit;text-decoration:none;min-width:0;
  transition:border-color .15s,transform .15s}
a.app:hover,a.app:focus-visible{border-color:var(--accent);transform:translateY(-1px);outline:none}
a.app:focus-visible{box-shadow:0 0 0 3px var(--accent-soft)}
.app .ic{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.app .ic svg{width:24px;height:24px}
.app .nm{font-weight:600;font-size:1.02rem}
.app .ds{color:var(--muted);font-size:.86rem;margin:0}
.app .url{font-family:var(--f-num);font-size:.72rem;color:var(--muted);overflow-wrap:anywhere}
.tag{position:absolute;top:14px;right:14px;font-size:.7rem;font-weight:600;padding:1px 7px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);
  text-decoration:none;font-size:.9rem}
.links a:hover,.links a:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.soon{margin:0;padding-left:1.2em;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:2px}
button{font:inherit;font-size:.82rem;padding:5px 12px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer}
button:hover,button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.edit-row{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:center}
.edit-row input{font:inherit;font-size:.85rem;padding:6px 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface);color:var(--ink);min-width:0;width:100%}
.panel{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px dashed var(--accent);border-radius:10px;background:var(--surface)}
.panel p{margin:0;color:var(--muted);font-size:.82rem}
.actions{display:flex;flex-wrap:wrap;gap:8px}
footer{color:var(--muted);font-size:.78rem}
@media (max-width:560px){.edit-row{grid-template-columns:1fr}.clock{text-align:left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head><body>

<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="var(--accent)"/><path d="M16 8h8v8h8v8h-8v8h-8v-8H8v-8h8z" fill="var(--surface)"/></svg>
      <div>
        <h1>동신병원 응급실 포털</h1>
        <p class="sub">지역응급의료기관 · 업무 도구 모음</p>
      </div>
    </div>
    <div class="clock" aria-live="off">
      <div class="t" id="time">--:--</div>
      <div class="d" id="date"></div>
      <span class="shift" id="shift"></span>
    </div>
  </header>

  <section aria-labelledby="h-apps">
    <div class="sec-head">
      <h2 id="h-apps">업무 앱</h2>
      <button type="button" id="editBtn">주소 편집</button>
    </div>
    <div class="panel" id="editPanel" hidden>
      <p>앱 이름과 주소를 바꾸면 이 컴퓨터(브라우저)에만 저장됩니다. 주소를 비우면 그 앱은 숨겨집니다.</p>
      <div id="editRows" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="actions">
        <button type="button" id="addBtn">링크 추가</button>
        <button type="button" class="primary" id="saveBtn">저장</button>
        <button type="button" id="resetBtn">기본값으로</button>
        <span id="resetConfirm" hidden><button type="button" id="resetYes">정말 초기화</button></span>
      </div>
    </div>
    <div class="grid" id="apps"></div>
  </section>

  <section aria-labelledby="h-ext">
    <h2 id="h-ext">외부 바로가기</h2>
    <div class="links">
      <a href="https://www.e-gen.or.kr/" target="_blank" rel="noopener">E-Gen 응급의료포털</a>
      <a href="https://biz.hira.or.kr/" target="_blank" rel="noopener">심평원 요양기관업무포털</a>
      <a href="https://nedrug.mfds.go.kr/" target="_blank" rel="noopener">의약품안전나라</a>
      <a href="https://www.kdca.go.kr/" target="_blank" rel="noopener">질병관리청</a>
    </div>
  </section>

  <section aria-labelledby="h-soon">
    <h2 id="h-soon">준비 중</h2>
    <ul class="soon">
      <li>병동콜 기록 — 호출 시각·병동·사유·소요 시간</li>
      <li>월간 응급실 통계 분석 — 원무 통계표 자동 정리</li>
      <li>다국어 귀가 안내문 — 진단별 주의사항</li>
    </ul>
  </section>

  <footer>환자 정보는 이 포털에 저장되지 않습니다. 각 앱의 저장 방식은 앱마다 다릅니다.</footer>
</div>

<script>
const ICONS={
  talk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11v8H9l-3 3v-3H4z"/><path d="M15 9h5v8h-2v3l-3-3h-4v-2"/></svg>',
  transfer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15V8h10v7"/><path d="M13 10h4l3 3v2h-7"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M8 9.5v4M6 11.5h4"/></svg>',
  code:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  backup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 15h3M13 15h3"/></svg>',
  duty:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11M15 9v11"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
};
const DEFAULTS=[
  {id:'talk',name:'문진·설명 통역',desc:'외국인 환자 문진과 검사 결과 설명. 국기를 눌러 언어 선택',url:'https://sunkyongmin.github.io/dstalk/'},
  {id:'code',name:'상병 선정',desc:'진료 내용과 처방으로 적절한 상병코드 추천',url:'https://sunkyongmin.github.io/dscode/'},
  {id:'transfer',name:'전원병원 찾기',desc:'중증질환 수용 가능 여부와 거리로 전원 후보 정렬',url:'https://edtransfer.streamlit.app/'},
  {id:'backup',name:'배후진료 당직표',desc:'내과·외과·정형외과 당직표 사진으로 달력 만들기',url:'https://sunkyongmin.github.io/dsbackup/'},
  {id:'duty',name:'간호사 근무표',desc:'D/E/N 3교대 근무표 작성과 자동 초안',url:'https://sunkyongmin.github.io/dsduty/'}
];
const KEY='dsportal.apps.v1';
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s))return s}catch(e){}return DEFAULTS.map(a=>({...a}))}
function store(list){try{localStorage.setItem(KEY,JSON.stringify(list))}catch(e){}}
let apps=load();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
  const g=document.getElementById('apps');
  g.innerHTML=apps.filter(a=>a.url).map(a=>`
    <a class="app" href="${esc(a.url)}" target="_blank" rel="noopener">
      ${a.tag?`<span class="tag">${esc(a.tag)}</span>`:''}
      <span class="ic">${ICONS[a.id]||ICONS.link}</span>
      <span class="nm">${esc(a.name)}</span>
      ${a.desc?`<p class="ds">${esc(a.desc)}</p>`:''}
      <span class="url">${esc(a.url.replace(/^https?:\/\//,''))}</span>
    </a>`).join('');
}
function renderEdit(){
  document.getElementById('editRows').innerHTML=apps.map((a,i)=>`
    <div class="edit-row">
      <input id="n${i}" value="${esc(a.name)}" aria-label="앱 이름">
      <input id="u${i}" value="${esc(a.url)}" placeholder="https://" aria-label="주소">
      <button type="button" data-del="${i}">삭제</button>
    </div>`).join('');
}
function readEdit(){
  apps=apps.map((a,i)=>({...a,name:document.getElementById('n'+i).value.trim()||a.name,url:document.getElementById('u'+i).value.trim()}));
}
const panel=document.getElementById('editPanel');
document.getElementById('editBtn').onclick=()=>{panel.hidden=!panel.hidden;if(!panel.hidden)renderEdit()};
document.getElementById('addBtn').onclick=()=>{readEdit();apps.push({id:'link',name:'새 링크',desc:'',url:''});renderEdit()};
document.getElementById('editRows').onclick=e=>{const i=e.target.dataset.del;if(i!==undefined){readEdit();apps.splice(+i,1);renderEdit()}};
document.getElementById('saveBtn').onclick=()=>{readEdit();store(apps);render();panel.hidden=true};
document.getElementById('resetBtn').onclick=()=>{document.getElementById('resetConfirm').hidden=false};
document.getElementById('resetYes').onclick=()=>{apps=DEFAULTS.map(a=>({...a}));store(apps);render();renderEdit();document.getElementById('resetConfirm').hidden=true};

const DAYS='일월화수목금토';
function tick(){
  const n=new Date(),h=n.getHours(),m=n.getMinutes();
  document.getElementById('time').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  document.getElementById('date').textContent=`${n.getFullYear()}.${n.getMonth()+1}.${n.getDate()} (${DAYS[n.getDay()]})`;
  const dd=new Date(n.getTime()-8*3600e3).getDay(); // 08시 기준 근무일
  const wk=dd===0||dd===6, s=document.getElementById('shift');
  const night=h>=17||h<8;
  s.textContent=wk?'주말 · 병동 당직 있음':night?'평일 야간 · 병동콜 담당':'평일 주간';
  s.className='shift'+(night&&!wk?' night':'');
}
render();tick();setInterval(tick,15000);
</script>

</body></html>
